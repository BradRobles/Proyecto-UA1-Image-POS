<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #fff; text-align: center; }
        #webcam-container { margin: 10px auto; border: 4px solid #333; border-radius: 10px; overflow: hidden; display: inline-block; }
        #label-container { font-size: 24px; font-weight: bold; color: #2e7d32; margin-top: 10px; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="webcam-container"></div>
    <div id="label-container">Cargando modelo...</div>
    
    <script>
        const URL = "http://localhost:5001/model/";
        let model, webcam, labelContainer, maxPredictions;
        let trackingLabel = null;
        let trackingStartTime = null;
        const CONFIDENCE_THRESHOLD = 0.85;
        const TIME_THRESHOLD = 1500; // 1.5 seconds

        // Communicate with Streamlit
        function sendValueToStreamlit(value) {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: "setComponentValue",
                value: value
            }, "*");
        }

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                const flip = true; // whether to flip the webcam
                webcam = new tmImage.Webcam(400, 400, flip); // width, height, flip
                await webcam.setup(); // request access to the webcam
                await webcam.play();
                window.requestAnimationFrame(loop);

                document.getElementById("webcam-container").appendChild(webcam.canvas);
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "Cámara lista. Escaneando...";
                
                // Notify Streamlit we are ready (adjust iframe height)
                window.parent.postMessage({
                    isStreamlitMessage: true,
                    type: "setFrameHeight",
                    height: 500
                }, "*");
            } catch (e) {
                document.getElementById("label-container").innerHTML = "Error al cargar la cámara/modelo: " + e;
            }
        }

        async function loop() {
            webcam.update(); // update the webcam frame
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let bestLabel = "Desconocido";
            let bestProb = 0;
            
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > bestProb) {
                    bestProb = prediction[i].probability;
                    bestLabel = prediction[i].className;
                }
            }

            if (bestLabel !== "Desconocido" && bestProb >= CONFIDENCE_THRESHOLD) {
                if (trackingLabel === bestLabel) {
                    let elapsed = Date.now() - trackingStartTime;
                    labelContainer.innerHTML = `Confirmando ${bestLabel}... (${Math.round(bestProb*100)}%)`;
                    
                    if (elapsed >= TIME_THRESHOLD) {
                        // Confirmed! Send to Streamlit
                        sendValueToStreamlit(bestLabel);
                        
                        // Reset to prevent rapid double-scanning
                        trackingLabel = null;
                        trackingStartTime = null;
                        
                        // Pause briefly visually
                        labelContainer.innerHTML = `✅ ¡${bestLabel} Escaneado!`;
                        await new Promise(r => setTimeout(r, 1500)); // wait 1.5s before next scan
                    }
                } else {
                    trackingLabel = bestLabel;
                    trackingStartTime = Date.now();
                }
            } else {
                trackingLabel = null;
                trackingStartTime = null;
                labelContainer.innerHTML = `Escaneando...`;
            }
        }

        // Start everything
        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; 
            background-color: transparent; 
            text-align: center; 
            overflow: hidden;
        }
        canvas { 
            display: inline-block; 
            border-radius: 10px; 
            border: 3px solid #333; 
            box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="webcam-container"></div>
    
    <script>
        // Streamlit Custom Component API
        function sendMessageToStreamlit(type, data) {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: type,
                ...data
            }, "*");
        }

        // Initialize component
        sendMessageToStreamlit("streamlit:componentReady", {apiVersion: 1});
        sendMessageToStreamlit("streamlit:setFrameHeight", {height: 420});

        const URL = "http://localhost:5001/model/";
        let model, webcam, maxPredictions;
        let trackingLabel = null;
        let trackingStartTime = null;
        const CONFIDENCE_THRESHOLD = 0.85;
        const TIME_THRESHOLD = 1500;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                webcam = new tmImage.Webcam(400, 400, true);
                await webcam.setup();
                await webcam.play();
                window.requestAnimationFrame(loop);

                document.getElementById("webcam-container").appendChild(webcam.canvas);
            } catch (e) {
                console.error("Error al cargar modelo:", e);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let bestLabel = "Desconocido";
            let bestProb = 0;
            
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > bestProb) {
                    bestProb = prediction[i].probability;
                    bestLabel = prediction[i].className;
                }
            }

            if (bestLabel !== "Desconocido" && bestProb >= CONFIDENCE_THRESHOLD) {
                if (trackingLabel === bestLabel) {
                    let elapsed = Date.now() - trackingStartTime;
                    if (elapsed >= TIME_THRESHOLD) {
                        // Confirmed! Send value to Streamlit
                        sendMessageToStreamlit("streamlit:setComponentValue", {value: {label: bestLabel, ts: Date.now()}});
                        
                        trackingLabel = null;
                        trackingStartTime = null;
                        
                        // Wait to avoid spamming the same product
                        await new Promise(r => setTimeout(r, 1500));
                    }
                } else {
                    trackingLabel = bestLabel;
                    trackingStartTime = Date.now();
                }
            } else {
                trackingLabel = null;
                trackingStartTime = null;
            }
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            margin: 0; padding: 0; 
            background-color: transparent; 
        }
        .ticket-container {
            background-color: #ffffe0;
            padding: 20px;
            border: 2px dashed #999;
            font-family: 'Courier New', Courier, monospace;
            color: #000;
            min-height: 400px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
        .ticket-header {
            text-align: center;
            margin-bottom: 15px;
        }
        .ticket-header h2 {
            margin: 0;
            margin-bottom: 5px;
        }
        .ticket-header p {
            margin: 0;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 1.1em;
            align-items: center;
        }
        .item-details {
            font-size: 0.8em;
            color: #555;
            margin-bottom: 10px;
            margin-top: -5px;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.5em;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px dashed #000;
        }
        .del-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            padding: 0 0 0 10px;
        }
        .del-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script>
        function sendMessageToStreamlit(type, data) {
            window.parent.postMessage({
                isStreamlitMessage: true,
                type: type,
                ...data
            }, "*");
        }

        // Initialize component
        sendMessageToStreamlit("streamlit:componentReady", {apiVersion: 1});

        function deleteItem(index) {
            sendMessageToStreamlit("streamlit:setComponentValue", {value: {index: index, ts: Date.now()}});
        }

        window.addEventListener("message", function(event) {
            if (event.data.type === "streamlit:render") {
                const args = event.data.args;
                const items = args.items;
                const total = args.total;
                const date_str = args.date_str;
                
                let html = '<div class="ticket-container">';
                html += '<div class="ticket-header">';
                html += '<h2>BRIGHTON\'S</h2>';
                html += '<p>Av. Principal #123<br>¡Gracias por su compra!</p>';
                html += '<p><small>' + date_str + '</small></p>';
                html += '</div>';
                html += '<div style="border-top: 1px dashed #000; margin-bottom: 10px;"></div>';
                
                if (items.length === 0) {
                    html += '<p style="text-align: center; color: #666; margin-top: 50px;">-- Carrito Vacío --</p>';
                } else {
                    for (let i = 0; i < items.length; i++) {
                        let item = items[i];
                        let name = item.name.substring(0, 15);
                        let price = item.price.toFixed(2);
                        html += '<div class="item-row">';
                        html += '<span>1x ' + name + '</span>';
                        html += '<span>$' + price + ' <button class="del-btn" title="Eliminar" onclick="deleteItem(' + i + ')">🗑️</button></span>';
                        html += '</div>';
                        html += '<div class="item-details">[Vía ' + item.source + ']</div>';
                    }
                }
                
                html += '<div class="total-row"><span>TOTAL:</span><span>$' + total.toFixed(2) + '</span></div>';
                html += '</div>';
                
                document.getElementById("root").innerHTML = html;
                
                // Tell Streamlit to adjust height based on content
                const height = document.body.scrollHeight;
                sendMessageToStreamlit("streamlit:setFrameHeight", {height: height + 20});
            }
        });
    </script>
</body>
</html>
